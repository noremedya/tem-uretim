# Geliştirme ortamı. Üretim için docker-compose.prod.yml kullanılır.
services:
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      SERVER_NAME: ":8000"
    # Taban imajdan (dunglas/frankenphp) gelen healthcheck Caddy admin API'sini
    # (localhost:2019/metrics) yoklar; php-server bu portu açmadığı için konteyner
    # hep "unhealthy" görünür. Yerine Laravel'in /up endpoint'i kullanılır.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tem_uretim
      POSTGRES_USER: tem_uretim
      POSTGRES_PASSWORD: secret
      TZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tem_uretim -d tem_uretim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
